version: '3.8'

services:
  test-db:
    image: postgres:16-alpine
    container_name: redclay-test-db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: redclay_test
    ports:
      - "5433:5432"
    volumes:
      - ./docs/database/migrations.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d redclay_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for faster tests

  # Optional: pgAdmin for debugging
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: redclay-test-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - test-db
    profiles:
      - debug  # Only start with: docker-compose --profile debug up
